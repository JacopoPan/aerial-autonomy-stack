name: jetpack6 branch images

on:
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch: {}

jobs:
  amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /usr/share/swift &
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" &
          wait
          sudo docker image prune --all --force
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* 

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Check swap
        run: |
          free -h
          sudo swapon --show

      - name: Check disk space
        run: df -h

      - name: Move Docker to /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep "Docker Root Dir"

      - name: Check out jetpack6 branch
        uses: actions/checkout@v4
        with:
          ref: jetpack6

      - name: Confirm branch
        run: |
          echo "Building: $(git log -1 --format='%h %s')"
          echo "Branch tips containing HEAD: $(git branch -r --contains HEAD | tr -d ' ' | paste -sd, -)"
          grep 'FROM nvcr.io' ./tools_and_docs/docker/aircraft.dockerfile

      - name: Clone external repos
        run: CLONE_ONLY=true ./tools_and_docs/sim_build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all amd64 images
        run: |
          docker buildx build --target ros2-image --output type=oci,dest=/tmp/transitional-ros2-image,tar=false -f ./tools_and_docs/docker/aircraft.dockerfile .
          docker buildx build --target ros2-qgc-image --build-context transitional-ros2-image=oci-layout:///tmp/transitional-ros2-image --output type=oci,dest=/tmp/transitional-ros2-qgc-image,tar=false -f ./tools_and_docs/docker/ground.dockerfile .
          df -h
          docker buildx build --build-context transitional-ros2-image=oci-layout:///tmp/transitional-ros2-image -f ./tools_and_docs/docker/ground.dockerfile .
          df -h
          docker buildx build --build-context transitional-ros2-qgc-image=oci-layout:///tmp/transitional-ros2-qgc-image -f ./tools_and_docs/docker/simulation.dockerfile .
          df -h
          docker buildx build --build-arg BUILD_ADVANCED_ODOM=true -f ./tools_and_docs/docker/aircraft.dockerfile .
          df -h

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read

    steps:       
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Check swap
        run: |
          free -h
          sudo swapon --show

      - name: Check disk space
        run: df -h

      - name: Check out jetpack6 branch
        uses: actions/checkout@v4
        with:
          ref: jetpack6

      - name: Confirm branch
        run: |
          echo "Building: $(git log -1 --format='%h %s')"
          echo "Branch tips containing HEAD: $(git branch -r --contains HEAD | tr -d ' ' | paste -sd, -)"
          grep 'FROM nvcr.io' ./tools_and_docs/docker/aircraft.dockerfile

      - name: Clone external repos
        run: CLONE_ONLY=true ./tools_and_docs/deploy_build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the aircraft image
        run: docker buildx build --build-arg BUILD_ADVANCED_ODOM=true -t aircraft-image -f ./tools_and_docs/docker/aircraft.dockerfile .
